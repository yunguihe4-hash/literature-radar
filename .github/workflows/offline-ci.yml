name: Offline tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      LITERATURE_RADAR_OFFLINE_TEST: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: 'error::ResourceWarning'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared dependencies and build tool
        run: python -m pip install . build 'setuptools>=77'
      - name: Test synthetic workflows only
        run: python -m unittest
      - name: Validate both fictional configurations
        run: |
          literature-radar config validate --config-dir examples/synthetic-topic
          literature-radar config validate --config-dir examples/synthetic-acoustic
      - name: Build wheel
        run: python -m build --wheel --no-isolation
